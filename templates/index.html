<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <title>Yalla Chat - Starter (Web)</title>
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <style>
    body { font-family: Arial, Helvetica, sans-serif; margin:0; padding:16px; background:#f7f7fb; }
    .app { max-width:720px; margin:12px auto; background:#fff; border-radius:8px; box-shadow:0 2px 8px rgba(0,0,0,0.06); overflow:hidden; }
    header { padding:12px 16px; background:linear-gradient(90deg,#003366,#E31B23); color:white; }
    header h1 { margin:0; font-size:18px; }
    #messages { height:60vh; overflow:auto; padding:12px; background:#fafafa; }
    .msg { margin-bottom:8px; }
    .msg.system { color:#666; font-style:italic; }
    .bubble { display:inline-block; padding:8px 12px; border-radius:16px; background:#e6f0ff; }
    .bubble.me { background:#d9ffd9; }
    footer { display:flex; padding:12px; gap:8px; border-top:1px solid #eee; }
    input[type=text] { flex:1; padding:10px; border-radius:8px; border:1px solid #ddd; }
    button { padding:10px 12px; border-radius:8px; border:none; background:#003366; color:white; }
    .meta { font-size:12px; color:#777; }
  </style>
</head>
<body>
  <div class="app">
    <header>
      <h1>Yalla Chat — Starter (Local)</h1>
      <div class="meta">Connects to local WebSocket server. Use a username to join.</div>
    </header>
    <div id="messages"></div>
    <footer>
      <input id="input" type="text" placeholder="Type a message..." />
      <button id="send">Send</button>
    </footer>
  </div>

<script>
let ws = null;
let username = localStorage.getItem("yalla_username");
if(!username) {
  username = prompt("Enter your username (no spaces):", "guest"+Math.floor(Math.random()*1000));
  localStorage.setItem("yalla_username", username);
}

function addMessage(obj){
  const box = document.getElementById("messages");
  const div = document.createElement("div");
  div.className = "msg";
  if(obj.type === "system"){
    div.className = "msg system";
    div.textContent = `[${new Date(obj.time).toLocaleTimeString()}] ${obj.text}`;
  } else {
    const bubble = document.createElement("div");
    bubble.className = "bubble" + (obj.from === username ? " me" : "");
    bubble.innerHTML = "<strong>" + (obj.from||"") + ":</strong> " + (obj.text||"");
    const time = document.createElement("div");
    time.className = "meta";
    time.textContent = new Date(obj.time).toLocaleTimeString();
    div.appendChild(bubble);
    div.appendChild(time);
  }
  box.appendChild(div);
  box.scrollTop = box.scrollHeight;
}

function connect(){
  const protocol = (location.protocol === "https:") ? "wss:" : "ws:";
  const url = protocol + "//" + location.host + "/ws/" + encodeURIComponent(username);
  ws = new WebSocket(url);
  ws.onopen = ()=> addMessage({type:"system", text:"Connected to server", time:new Date().toISOString()});
  ws.onmessage = (e)=> {
    try {
      const obj = JSON.parse(e.data);
      addMessage(obj);
    } catch(err){ console.error(err); }
  };
  ws.onclose = ()=> addMessage({type:"system", text:"Disconnected", time:new Date().toISOString()});
  ws.onerror = (e)=> console.error("WS error", e);
}

document.getElementById("send").addEventListener("click", ()=> {
  const v = document.getElementById("input").value.trim();
  if(!v) return;
  if(ws && ws.readyState === WebSocket.OPEN){
    ws.send(JSON.stringify({type:"chat", text:v}));
    document.getElementById("input").value = "";
  } else {
    alert("Not connected");
  }
});

window.addEventListener("load", ()=> connect());
</script>
</body>
</html>
